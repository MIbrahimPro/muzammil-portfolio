<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_extract/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_extract/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_extract/favicon-16x16.png">
    <link rel="manifest" href="/favicon_extract/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muzammil H - Shopify Developer</title>
  </head>
  <body>
    <style>
      #global-loader {
        position: fixed;
        inset: 0;
        background: #FAFAFA;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
      }
      #global-loader.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      @keyframes pulseLogo {
        0%, 100% { opacity: 0.5; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes loadingBar {
        0% { width: 0%; }
        100% { width: 100%; }
      }
      .loader-logo {
        font-family: 'Outfit', sans-serif;
        font-size: 32px;
        font-weight: 800;
        color: #292928;
        letter-spacing: -0.05em;
        animation: pulseLogo 1.5s ease-in-out infinite;
      }
      .loader-bar-bg {
        width: 120px;
        height: 4px;
        background: rgba(0,0,0,0.05);
        border-radius: 4px;
        margin-top: 24px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        background: #35C9CE;
        border-radius: 4px;
        animation: loadingBar 1.5s ease-out forwards;
      }
      body.loading {
        overflow: hidden !important;
      }
    </style>
    <div id="global-loader">
      <div class="loader-logo">MŬZ</div>
      <div class="loader-bar-bg">
        <div class="loader-bar-fill"></div>
      </div>
    </div>
    <script>
      document.body.classList.add('loading');
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
